<style>
:root{
  --glassbg:rgba(250,250,251,.8);
  --field:#fff;
  --page:#e9eaec; --surface:#fbfbfc; --ink:#121418; --ink2:#474c55; --mute:#868b94; --faint:#b8bcc3;

  --mono:"Oxanium",ui-monospace,SFMono-Regular,Menlo,monospace;
}
body.dark{--glassbg:rgba(18,20,24,.74);--page:#0b0c0e;--surface:#141619;--field:#1c1f23;--ink:#eceef1;--ink2:#b4bac3;--mute:#7c838d;--faint:#4a4f57;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--chip:rgba(255,255,255,.06)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font:400 13px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:0}
.app{height:100%;position:relative;--lw:0px;--rw:0px}
.top{position:fixed;top:14px;left:14px;right:14px;height:48px;z-index:40;display:flex;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.ug{background:var(--glassbg);backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35);border:1px solid var(--line2);box-shadow:0 12px 40px rgba(0,0,0,.14)}
.brand{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px 0 10px;border-radius:16px}
.navpill{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:999px}
.navpill .tab{height:36px;padding:0 18px;border-radius:999px;color:var(--ink2)}
.navpill .tab.on{background:var(--ink);color:var(--surface);font-weight:500}
.top .tbtn{height:44px;border-radius:14px;padding:0 16px}
.mark{width:28px;height:28px;border-radius:9px;background:#121418;display:grid;place-items:center;flex:none}

.crumbs{display:flex;gap:8px;align-items:center;color:var(--mute);white-space:nowrap;overflow:hidden}

.grow{flex:1}
.tbtn{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tbtn:hover{background:var(--chip)}
.tbtn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.status{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:12px}

.main{position:fixed;inset:0}
.panel{position:fixed;top:76px;bottom:14px;width:290px;z-index:30;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-height:0;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s;opacity:0}
.panel.open{transform:none!important;opacity:1}
.lib{left:14px;transform:translateX(calc(-100% - 24px))}
.insp{right:14px;width:384px;transform:translateX(calc(100% + 24px))}
.insp>.tabs{display:none}
.phead.row{display:flex;align-items:center;justify-content:space-between}
.phead.row h3{margin:0}
.xbtn{width:30px;height:30px;border-radius:10px;border:1px solid var(--line2);background:var(--field);cursor:pointer;color:var(--ink2);display:grid;place-items:center;flex:none}
.xbtn:hover{color:var(--ink)}
.phead .ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phead .ttl h3{margin:0}
.vit{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.phead{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.phead h3{margin:0 0 8px;font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.search{width:100%;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--field);padding:0 11px;outline:none}

.scroll{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}
.grp{padding:10px 8px 4px}
.grp-h{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:11px;font-weight:500;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em}

.grp-h .n{margin-left:auto;color:var(--faint);font-family:var(--mono)}
.item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;color:var(--ink2)}

.libfoot{border-top:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi b{display:block;font-size:16px;font-weight:500;letter-spacing:-.02em}
.kpi span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}

.stage{position:absolute;inset:0;--ink:#121418;--ink2:#474c55;--mute:#868b94;--line:rgba(18,20,24,.08);--line2:rgba(18,20,24,.14);--surface:#fbfbfc;--field:#fff;color:var(--ink);min-width:0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#fbfbfb 0%,#eceef0 55%,#dfe2e6 100%);transition:background .5s}

.ov{position:absolute;pointer-events:none}
.title{left:calc(var(--lw) + 26px);top:86px;transition:left .38s cubic-bezier(.2,.8,.2,1)}
.title .sub{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em}
.title h1{margin:2px 0 0;font-size:30px;font-weight:500;letter-spacing:-.035em;line-height:1.05}
.title .meta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:7px;background:rgba(255,255,255,.7);border:1px solid var(--line);font-size:11px;color:var(--ink2);backdrop-filter:blur(8px)}
.stage.void .chip,.stage.blue .chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1);color:#cfd3d9}

.cams{right:14px;top:14px;pointer-events:auto;display:flex;flex-direction:column;gap:6px}
.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(18,20,24,.08);border-radius:13px;box-shadow:0 8px 30px rgba(18,20,24,.08)}

.cbtn{height:30px;min-width:30px;padding:0 10px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-size:12px;text-align:left;color:inherit;white-space:nowrap}

.dock{left:calc(50% + (var(--lw) - var(--rw))/2);bottom:18px;transform:translateX(-50%);border-radius:18px!important;transition:left .38s cubic-bezier(.2,.8,.2,1);pointer-events:auto;display:flex;align-items:center;gap:6px;padding:6px;max-width:calc(100% - 28px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock>*{flex:none}
.seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:rgba(127,127,127,.09)}
.sep2{width:1px;height:22px;background:var(--line2);flex:none;margin:0 4px}

.rng{display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12px;white-space:nowrap}

.tog{height:30px;padding:0 10px;border-radius:9px;border:0;background:transparent;cursor:pointer;font-size:12px;color:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tog i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;opacity:.5}
.tog.on i{background:var(--accent);border-color:var(--accent);opacity:1;box-shadow:0 0 8px var(--accent)}
.tog:hover{background:rgba(127,127,127,.12)}
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;transform:translate(-9px,-9px);white-space:nowrap}

.tip{position:absolute;pointer-events:none;padding:5px 9px;border-radius:8px;background:var(--ink);color:#fff;font-size:11.5px;display:none;white-space:nowrap;z-index:5}
.toast{position:absolute;left:calc(50% + (var(--lw) - var(--rw))/2);top:80px;transform:translate(-50%,-8px);opacity:0;transition:.25s;padding:8px 14px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;pointer-events:none;z-index:6}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

.tabs{display:flex;gap:2px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{height:30px;padding:0 11px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--mute);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--chip)}

.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 10px;font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.ptitle{font-size:22px;font-weight:500;letter-spacing:-.03em;line-height:1.15;margin:6px 0 8px}
.lead{color:var(--ink2);margin:0}
p.body{color:var(--ink2);margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0;border-top:1px solid var(--line)}
.kv div{padding:7px 0;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){color:var(--mute);padding-right:14px;white-space:nowrap}

ul.ind{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.ind li{padding:9px 11px;border-radius:10px;background:var(--chip);color:var(--ink2)}
ul.ind li b{color:var(--ink);font-weight:500}
.nav2{display:flex;gap:8px}
.nav2 button{flex:1;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--field);cursor:pointer}
.nav2 button:hover{background:#f3f4f6}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hero div{background:var(--surface);padding:11px 12px}
.hero b{display:block;font-size:19px;font-weight:500;letter-spacing:-.03em}
.hero span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-weight:500;color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:6px 6px 6px 0;border-bottom:1px solid var(--line2)}
table.t td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}

.bar{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;margin:7px 0;font-size:12px}
.bar .tr{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px}

.stack{display:flex;flex-direction:column;gap:6px}
.rowx{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.rowx .nm{flex:1}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pre{border:1px solid var(--line2);border-radius:11px;padding:8px;cursor:pointer;background:var(--field);text-align:left}

.pre .sw{display:flex;height:26px;border-radius:7px;overflow:hidden;margin-bottom:6px}
.pre .sw i{flex:1}
.pre span{font-size:11.5px}
.segw{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--chip)}
.segw button{flex:1;height:30px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--ink2)}
.segw button.on{background:var(--field);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:500}
.color{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.color label{flex:1;color:var(--ink2)}
.color input[type=color]{width:34px;height:26px;border:1px solid var(--line2);border-radius:7px;padding:2px;background:var(--field);cursor:pointer}
.color code{font-family:var(--mono);font-size:11px;color:var(--mute);width:62px;text-align:right}
.txt{width:100%;height:34px;border-radius:9px;border:1px solid var(--line2);padding:0 11px;outline:none;background:var(--field)}
.mk{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.mk .h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.mk .h b{font-size:14px;font-weight:500}
.mk .h span{color:var(--mute);font-size:11.5px}
.mk .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.mk .g div{background:var(--chip);border-radius:8px;padding:6px 8px}
.mk .g small{display:block;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.mk .g em{font-style:normal;font-family:var(--mono);font-size:11.5px}
.mk p{margin:6px 0 0;color:var(--ink2);font-size:12.5px}

.note{font-size:11.5px;color:var(--mute);margin:0}
.flow{display:flex;flex-direction:column;gap:6px}
.flow div{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:9px 11px;border-radius:10px;background:var(--chip)}

.tdwrap{left:calc(var(--lw) + 26px);top:184px;pointer-events:auto;transition:left .38s cubic-bezier(.2,.8,.2,1)}
.stage.lab .tdwrap{display:none}
.stage.void .tdwrap .tbtn:not(.dark),.stage.blue .tdwrap .tbtn:not(.dark){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#e8ebef}
.stage.void .tbtn.dark,.stage.blue .tbtn.dark{background:#fff;color:#121418;border-color:#fff}

#labDock{display:none}

.backb{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--field);cursor:pointer}
.backb:hover{background:var(--chip)}
.tdbig{width:100%;height:44px;border-radius:11px;border:0;background:var(--accent);color:#fff;font-weight:500;cursor:pointer;margin-top:12px}

.selp{background:var(--chip)}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0 6px}

.color{cursor:pointer;padding-left:8px;padding-right:8px;margin:0 -8px;border-radius:8px}

.faces{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.chips2 button i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;opacity:.5}
.chips2 button.on{color:var(--ink);border-color:var(--ink)}
.chips2 button.on i{background:var(--accent);border-color:var(--accent);opacity:1}
.slider{display:flex;align-items:center;gap:10px;margin-top:10px}
.slider input{flex:1;accent-color:var(--accent)}
.subnav{position:sticky;top:0;z-index:3;background:var(--surface);display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:var(--field);cursor:pointer;color:var(--ink2);font-size:12px}
.subnav button:hover,.subnav button.on{color:var(--ink);border-color:var(--ink)}
.grpT{padding:18px 18px 4px;font-size:15px;font-weight:500;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;scroll-margin-top:52px}
.grpT span{font:500 10.5px var(--mono);color:var(--mute)}
.grpT+.sec{border-top:0}
details.adv summary{cursor:pointer;color:var(--ink2);font-size:12.5px;padding:4px 0;list-style:none}
details.adv summary::before{content:'+ ';color:var(--mute)}
details.adv[open] summary::before{content:'– '}
.styleBtn{padding:0 18px!important;margin:0 4px;letter-spacing:.01em;font-weight:500;color:#0b2536!important;border:1px solid rgba(255,255,255,.55)!important;background:linear-gradient(160deg,#f2fbff 0%,#cdeefe 48%,#9fd3ee 100%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(90,150,185,.35),0 0 0 1px rgba(159,211,238,.35),0 6px 22px rgba(159,211,238,.28)}
.styleBtn:hover{filter:brightness(1.08)}
#presentBtn{background:rgba(255,255,255,.06)!important;color:#e9fbff!important;border:1px solid rgba(205,238,254,.5)!important;box-shadow:inset 0 0 18px rgba(159,211,238,.1);gap:8px}
#presentBtn:before{content:'';width:0;height:0;border-left:8px solid #cdeefe;border-top:5px solid transparent;border-bottom:5px solid transparent}
#presentBtn:hover{background:rgba(205,238,254,.12)!important}
.navpill .tab.on{background:linear-gradient(160deg,rgba(242,251,255,.2),rgba(159,211,238,.14))!important;color:#f2fbff!important;box-shadow:inset 0 0 0 1px rgba(205,238,254,.45)}
body:not(.dark) #presentBtn{color:#0b3a52!important;border-color:rgba(14,116,144,.45)!important}
body:not(.dark) #presentBtn:before{border-left-color:#0e7490}
body:not(.dark) .navpill .tab.on{color:#0b2a3a!important}
.tdbig{background:linear-gradient(160deg,#f2fbff 0%,#cdeefe 48%,#9fd3ee 100%)!important;color:#0b2536!important}
.title h1,.grpT,.item>span:nth-child(2),.color label,.segw button,.pre span,.faces .pre b,.tab,.cbtn,.tog,.backb,.tdbig,.tbtn,.ptitle,.chips2 button,.subnav button,.kv div:nth-child(odd),table.t td:first-child,.bar>span:first-child,.rowx .nm,.mk .h b,.dbtn b,.dbtn small,.rchip,.crumbs span,.pin span{text-transform:capitalize}
.nc,.crumbs b{text-transform:none!important}
.dbtn{height:36px;padding:0 10px;border:0;border-radius:10px;background:transparent;cursor:pointer;color:inherit;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.1;min-width:76px}
.dbtn small{font-size:9.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase!important}
.dbtn b{font-weight:500;font-size:12.5px;display:flex;gap:5px;align-items:center}
.dbtn b:after{content:'';width:0;height:0;border:4px solid transparent;border-top-color:currentColor;margin-top:4px;opacity:.5}
.dbtn:hover,.dbtn.on{background:rgba(127,127,127,.12)}
.pop{left:calc(50% + (var(--lw) - var(--rw))/2);bottom:84px;border-radius:18px!important;transform:translateX(-50%);pointer-events:auto;display:none;padding:10px;max-width:calc(100% - 28px);z-index:4}
.pop.show{display:block}
.pop .pp{display:none}
.pop .pp.on{display:block}
.pop .pp h5{margin:2px 4px 8px;font:500 10.5px var(--sans);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.pop .grid{display:grid;grid-template-columns:repeat(3,minmax(92px,1fr));gap:4px}
.pop .grid .cbtn,.pop .grid .tog{height:38px;justify-content:center;text-align:center;border-radius:10px;background:rgba(127,127,127,.07)}
.pop .grid .cbtn.on{background:#121418;color:#fff}
.pop .grid .tog.on{background:rgba(159,211,238,.14)}
.regions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rchip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:var(--field);cursor:pointer;color:var(--ink2);font-size:12px}
.rchip:hover{color:var(--ink)}
.rchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grp-h{cursor:pointer;user-select:none;border-radius:8px}
.grp-h:hover{background:var(--chip)}
.grp-h .cv{margin-left:6px;color:var(--faint);transition:transform .2s;display:inline-block}
.grp.col .grp-h .cv{transform:rotate(-90deg)}
.grp.col .item{display:none}
.tdwrap{display:none;gap:8px}
.tdwrap.show{display:flex}
.app.present .lib,.app.present .insp,.app.present .top{display:none}
.app.present .title{top:20px}
.app.present .tdwrap{display:none}
.exitp{display:none;position:absolute;right:14px;bottom:16px;pointer-events:auto}
.app.present .exitp{display:block}
.app.present .cams{top:14px}

@media (max-width:1180px){
  .navpill{display:none}
  .insp>.tabs{display:flex}
  .status{display:none}
  .panel{box-shadow:0 20px 60px rgba(0,0,0,.25)}
}
@media (max-width:760px){
  .top{top:10px;left:10px;right:10px;gap:6px}
  .brand{padding:0 12px 0 8px}
  .crumbs .hide-s{display:none}
  .top .tbtn{height:40px;padding:0 11px}
  .panel{top:auto;left:0!important;right:0!important;bottom:0;width:auto!important;height:78vh;border-radius:22px 22px 0 0;transform:translateY(105%)!important}
  .panel.open{transform:none!important}
  .title{top:70px;left:16px!important}
  .title h1{font-size:22px}
  .title .meta{display:none}
  .tdwrap{top:128px;left:16px!important}
  .dock,.pop{left:50%!important}
  .rng input{width:70px}
  #presentBtn,#styleBtn{display:none}
}

<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand ug"><div class="mark"><i></i></div>
      <div class="crumbs"><b>hito.</b><span class="sep">/</span><span class="hide-s">Robotics Studio</span><span class="sep hide-s">/</span><span class="mono">H-01</span></div></div>
    <button class="tbtn ug pt" id="libBtn">Parts</button>
    <nav class="navpill ug" id="navTabs"></nav>
    <div class="grow"></div>
    <div class="status ug" style="height:44px;padding:0 14px;border-radius:14px"><i></i><span class="mono">55 DOF</span></div>
    <button class="tbtn ug pt" id="inspBtn">Details</button>
    <button class="tbtn styleBtn" id="styleBtn">Customization</button>
    <button class="tbtn dark" id="presentBtn">Present</button>
  </header>
  <div class="main">
    <aside class="panel lib ug" id="lib">
      <div class="phead"><div class="ttl"><h3>Component Library</h3><button class="xbtn" data-close="lib" title="Hide">‹</button></div><input class="search" id="search" placeholder="Search components"><div class="regions" id="regions"></div></div>
      <div class="scroll" id="libList"></div>
      <div class="libfoot">
        <div class="kpi"><b>55</b><span>DOF</span></div>
        <div class="kpi"><b>58 kg</b><span>Mass</span></div>
        <div class="kpi"><b id="bomK">$—</b><span>BOM est.</span></div>
      </div>
    </aside>
    <main class="stage" id="stage">
      <div class="loading" id="loading">Assembling H-01…</div>
      <div id="pins"></div>
      <div class="ov title">
        <div class="sub" id="tSys">hito. H-01 · General-purpose humanoid</div>
        <h1 id="tName">Full assembly</h1>
        <div class="meta" id="tMeta"><span class="chip mono">172 cm</span><span class="chip mono">58 kg</span><span class="chip mono">2.5 kWh</span><span class="chip mono">25 kg Payload</span></div>
      </div>
      <div class="ov labexit"><button class="tbtn dark" id="labExit">← Back To Full Robot</button></div>
      <div class="ov tdwrap" id="tdWrap"><button class="tbtn" id="backAll">← Full Assembly</button><button class="tbtn dark" id="tdBtn">Take It Apart →</button></div>
      <div class="ov dock glass" id="dock">
        <button class="cbtn styleBtn" id="dStyle">Customization</button>
        <div class="sep2"></div>
        <button class="dbtn" data-pop="pose"><small>Pose</small><b id="poseLbl">Idle</b></button>
        <button class="dbtn" data-pop="view"><small>View</small><b id="viewLbl">Normal</b></button>
        <button class="dbtn" data-pop="cam"><small>Camera</small><b id="camLbl">¾</b></button>
        <div class="sep2"></div>
        <div class="rng"><span>Explode</span><input type="range" id="explode" min="0" max="1" step="0.01" value="0"></div>
        <div class="sep2"></div>
        <button class="tog" id="tReset">Reset</button>
      </div>
      <div class="ov pop glass" id="pop">
        <div class="pp" data-pp="pose"><h5>Pose & motion</h5><div class="grid" id="poses"></div></div>
        <div class="pp" data-pp="view"><h5>View modes</h5><div class="grid">
          <button class="tog" id="tXray"><i></i>X-Ray</button>
          <button class="tog" id="tBlue"><i></i>Blueprint</button>
          <button class="tog" id="tPins"><i></i>Callouts</button>
          <button class="tog" id="tSpin"><i></i>Turntable</button></div></div>
        <div class="pp" data-pp="cam"><h5>Camera</h5><div class="grid" id="cams"></div></div>
      </div>
      <div class="ov dock glass" id="labDock">
        <button class="tog" id="lBack">← Robot</button>
        <div class="sep2"></div>
        <button class="cbtn" id="lPrev">Assemble</button>
        <button class="cbtn on" id="lPlay">▶ Play</button>
        <button class="cbtn" id="lNext">Disassemble</button>
        <div class="rng"><input type="range" id="lRange" min="0" max="1" step="0.001" value="0"><span class="mono" id="lStep">0/0</span></div>
        <div class="sep2"></div>
        <button class="tog" id="lPins"><i></i>Labels</button>
        <button class="tog" id="lSpin"><i></i>Turntable</button>
        <button class="tog" id="lFit">Fit</button>
      </div>
      <div class="ov exitp"><button class="tbtn dark" id="exitPresent">Exit present</button></div>
      <div class="tip" id="tip"></div>
      <div class="toast" id="toast"></div>
    </main>
    <aside class="panel insp ug" id="insp">
      <div class="phead row"><h3 id="inspTitle">Part</h3><button class="xbtn" data-close="insp" title="Hide">›</button></div>
      <div class="tabs" id="tabs"></div>
      <div class="scroll" id="inspBody"></div>
    </aside>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   DATA — every component of H-01
   ===================================================================== */
const SYS={
  perception:{n:'Perception',c:'#3d8bff'},
  compute:{n:'Compute & AI',c:'#8b6cff'},
  power:{n:'Power & thermal',c:'#20b673'},
  actuation:{n:'Actuation',c:'#ff5a1f'},
  hands:{n:'Hands & touch',c:'#e9559f'},
  structure:{n:'Structure & body',c:'#7d848e'}
};
const D=[
/* ---------- PERCEPTION ---------- */
{id:'vision',sys:'perception',name:'Vision cluster',qty:'2 stereo + ToF',internal:true,cost:650,
 sum:'Stereo global-shutter cameras behind the visor give H-01 depth, object pose and hand-eye coordination. A centre time-of-flight patch adds dense depth for close hand work.',
 how:'Two 5 MP global-shutter sensors sit on a rigid titanium bracket with a 64 mm baseline, close to human eye spacing, so learned stereo depth matches the scale of human demonstration video. Global shutter avoids smear while the head moves. Frames stream over GMSL2 straight into the vision-language-action model; there are no hand-built object detectors in the loop.',
 spec:[['Sensors','2 × 5 MP global shutter'],['Baseline','64 mm'],['Field of view','110° H each'],['Frame rate','60 fps, hardware-synced'],['Depth','Learned stereo + ToF 0.1–4 m'],['Link','GMSL2 serialiser'],['Glass-to-model','< 25 ms']],
 mat:'Sapphire lens covers, titanium bracket, IR-transparent visor window.',
 ind:['<b>Tesla Optimus</b> carries over the FSD philosophy: cameras only, no lidar, end-to-end neural nets.','<b>Figure 03</b> rebuilt its head cameras for a wider field of view, higher frame rate and lower latency.','<b>Boston Dynamics Atlas</b> pairs cameras with depth sensing for industrial work cells.','<b>Our call:</b> vision-first like Tesla, plus one cheap ToF patch because hands work at 20–60 cm where stereo is weakest.']},
{id:'face',sys:'perception',name:'Visor & intent light',qty:'1',internal:false,cost:380,
 sum:'The face. Choose a full glass mask with lens eyes, a half visor with a light bar, a satin face plate, or a fabric face, and set the mask, outline and light colours in Finish.',
 how:'The visor is 3 mm IR-transparent polycarbonate with a hard coat, so the cameras see straight through it. Behind it sits a curved 120-LED light bar. It works as a status language: steady means idle, a slow pulse means listening, a sweep means planning, amber means caution and red means stopped. A faceless head avoids the uncanny valley; head motion and light carry the expression.',
 spec:[['Shell','3 mm PC, IR-transparent'],['Light bar','120 addressable LEDs'],['Brightness','800 nits, auto-dim'],['Anti-fog','Heated film'],['States','Idle · Listen · Plan · Caution · Stop']],
 mat:'Hard-coated polycarbonate, anodised aluminium temple modules.',
 ind:['<b>Optimus</b> and <b>Figure</b> both use blank glossy faces; Figure shows a simple pixel glyph.','<b>1X NEO</b> softens the face and uses light rings at the "ears" to show attention.','<b>Our call:</b> the blank face reads premium; the light bar is a safety feature first and decoration second.']},
{id:'audio',sys:'perception',name:'Audio array',qty:'6 mics + 1 speaker',internal:false,cost:90,
 sum:'Beam-forming microphones in the two temple modules locate who is speaking; a full-range driver in the upper chest gives the robot a voice.',
 how:'Six MEMS microphones, three per temple, run beam-forming and echo cancellation on-device, so the robot can turn its head toward a speaker even while its own motors and voice are running. The wake word runs locally; speech streams into the language model.',
 spec:[['Microphones','6 × MEMS, 2 arrays'],['Speaker','2" full-range, 5 W'],['Echo cancel','On-device'],['Localisation','± 10° bearing']],
 mat:'Acoustic mesh grilles, sealed temple pods.',
 ind:['Home robots (<b>NEO</b>, <b>Figure 03</b>) lean hard on conversation.','Factory robots (<b>Digit</b>, <b>Atlas</b>) use audio far less; noise floors are high.','<b>Our call:</b> cheap to include, essential for anything near people.']},
{id:'palm_cam',sys:'perception',name:'Palm cameras',qty:'2',internal:false,cost:120,
 sum:'A wide-angle camera in each palm sees the object at the moment of grasp, exactly when the hand blocks the head cameras.',
 how:'Every grasp has a blind moment: the hand covers the object from the head’s view. A 140° palm camera with IR illumination closes that gap and feeds the low-level grasp policy, so the robot can correct finger placement in the final centimetres.',
 spec:[['Resolution','2 MP'],['Field of view','140°'],['Close focus','2 cm'],['Illumination','850 nm IR'],['Rate','60 fps']],
 mat:'Recessed sapphire window flush with the palm.',
 ind:['<b>Figure 03</b> introduced palm cameras for this occlusion problem.','<b>Our call:</b> adopt it; it costs little and improves grasp success most in clutter.']},
{id:'imu',sys:'perception',name:'IMU & state estimator',qty:'2',internal:true,cost:60,
 sum:'The robot’s inner ear: it knows which way is up, how fast it is moving and which foot is on the ground.',
 how:'A 6-axis IMU sits in the pelvis, the closest point to the centre of mass, sampling at 1 kHz. A Kalman filter fuses it with every joint encoder and both foot force sensors to estimate body orientation, velocity and contact state. A second IMU in the head stabilises the cameras.',
 spec:[['Gyro','± 2000 °/s'],['Accelerometer','± 16 g'],['Rate','1 kHz fused'],['Redundancy','Pelvis + head']],
 mat:'Vibration-isolated mount in the pelvis frame.',
 ind:['Balance recovery, push recovery and acrobatic demos all come down to fast, accurate state estimation.','<b>Our call:</b> commodity part, but mount and calibration quality matter more than the chip.']},
/* ---------- COMPUTE ---------- */
{id:'compute',sys:'compute',name:'Main computer',qty:'1 (dual SoC)',internal:true,cost:2400,
 sum:'The brain. It runs the vision-language-action model, whole-body control, safety and fleet software.',
 how:'A dual-SoC carrier board: one SoC runs the AI model (perception and policy), the other runs real-time control, comms and safety. A separate lockstep safety MCU can cut motor torque on its own. The board sits on a liquid cold plate in the upper chest, behind the speaker.',
 spec:[['AI compute','~2,000 TOPS target'],['Memory','128 GB LPDDR5X'],['Storage','2 TB NVMe'],['Power','120–180 W'],['I/O','8 × GMSL2, 10 GbE, EtherCAT master'],['Safety','Lockstep MCU, safe torque-off']],
 mat:'Copper cold plate, aluminium heat spreader.',
 ind:['<b>Tesla</b> designs its own inference chips and shares the training stack with its cars.','Most others build on <b>NVIDIA Jetson Thor / Orin</b>-class modules.','<b>Our call:</b> start on a Thor-class module, own the carrier board, keep the option to go custom later.']},
{id:'ai_stack',sys:'compute',name:'AI stack (software)',qty:'4 control rates',internal:true,cost:0,focus:'compute',
 sum:'A three-speed brain: a slow model that understands, a fast model that moves, and a controller that never falls over.',
 how:'System 2, a vision-language model running at about 7–10 Hz, reads the scene and the instruction and decides what to do. System 1, a visuomotor policy at about 200 Hz, turns that into whole-body motion targets. A whole-body controller at 1 kHz keeps balance and tracks the targets. Each joint drive closes its current loop at 20 kHz. Training mixes teleoperation data, human video and reinforcement learning in simulation, transferred to the real robot; updates ship over the air.',
 spec:[['System 2 planner','VLM · ~7–10 Hz'],['System 1 policy','~200 Hz'],['Whole-body control','1 kHz'],['Joint current loop','20 kHz'],['Data','Teleop + human video + sim RL'],['Updates','Over the air']],
 mat:'Software. Cost sits in R&D, not the bill of materials.',
 ind:['<b>Figure Helix</b> uses this System 2 / System 1 split.','<b>Tesla</b> trains end-to-end nets on shared FSD infrastructure.','Foundation models are also offered by <b>NVIDIA GR00T</b>, <b>Google DeepMind Gemini Robotics</b> and <b>Physical Intelligence</b>.','<b>Our call:</b> license a base model, own the data flywheel and the fine-tuning.']},
{id:'bus',sys:'compute',name:'Harness & real-time bus',qty:'31 drives',internal:true,cost:1620,
 sum:'The nervous system: power and data run to every joint over one harness, and each actuator has its own drive.',
 how:'Every actuator carries its own servo drive: GaN power stage, motor-side and output-side absolute encoders, and a 20 kHz current loop. The drives daisy-chain on EtherCAT back to the main computer at a 1 kHz cycle. 52 V power and data share one high-flex harness routed through the centre of each joint.',
 spec:[['Bus','EtherCAT, 1 kHz cycle'],['Drive stage','GaN FET, 20 kHz'],['Encoders','Dual absolute per joint'],['Bus voltage','52 V nominal'],['Cable life','10 M flex cycles']],
 mat:'High-flex PTFE-jacketed copper, overmoulded connectors.',
 ind:['<b>Tesla</b> integrates drive electronics into each actuator to cut wiring.','Harness failures at rotating joints are among the most common field faults for every humanoid program.','<b>Our call:</b> drives in the actuator, a single bus, no slip rings.']},
/* ---------- POWER ---------- */
{id:'battery',sys:'power',name:'Battery pack',qty:'140 cells',internal:true,cost:2600,
 sum:'A 2.5 kWh pack that is part of the torso structure, sitting low and centred to keep the centre of mass near the hips.',
 how:'140 cylindrical 21700 NMC cells in a 14S10P layout give 52 V nominal. The pack housing is a load-bearing part of the torso. A liquid cold plate runs under the modules, and a pack-level BMS watches every cell group.',
 spec:[['Cells','140 × 21700 NMC, 5.0 Ah class'],['Layout','14S10P · 2 modules of 7S10P'],['Voltage','50.4 V nom · 58.8 V full · 42 V cut-off'],['Capacity','50 Ah · 2.52 kWh (2.27 usable at 90 % DoD)'],['Continuous','1.6 kW (32 A, 3.2 A per cell)'],['Peak','4 kW for 10 s (80 A, 8 A per cell)'],['Protection','Fusible link per cell, aerogel barriers, vent path'],['Thermal','Cold plate + gap pad, 15–45 °C window, ±3 °C spread'],['Mass','~10.5 kg (cells 9.8 kg)'],['Cycle life','~1,000 cycles to 80 %'],['Charge','2 kW wireless or 3 kW contact · 20→80 % in ~50 min']],
 mat:'NMC cells, aluminium structural housing, ceramic-filled fire barriers.',
 ind:['<b>Tesla</b> revealed a 2.3 kWh, 52 V torso pack in 2022.','<b>Figure 03</b> also lists 2.3 kWh.','<b>Apptronik Apollo</b> and <b>UBTech Walker S2</b> use swappable packs; Walker S2 swaps its own battery.','<b>Our call:</b> fixed structural pack with fast wireless top-ups. Hot-swap is an optional variant for 24/7 sites.']},
{id:'bms',sys:'power',name:'BMS & power distribution',qty:'1',internal:true,cost:650,
 sum:'Keeps the pack safe and turns 52 V into every rail the robot needs.',
 how:'Monitors every cell group for voltage and temperature, balances them, and runs the main contactor. DC-DC stages make 12 V and 5 V rails for compute and sensors. A hard-wired e-stop chain and safe torque-off can remove motor power independently of software.',
 spec:[['Cell monitor','16-ch AFE (BQ76952-class), 14 groups + 6 temps'],['Balancing','Passive, 100 mA'],['Current sense','100 µΩ shunt, ± 0.5 %'],['Switching','2 × 150 A contactors + precharge relay/resistor'],['Main fuse','150 A'],['Rails','52 V bus · 12 V / 300 W · 5 V · 3.3 V'],['Safety','Dual-channel e-stop → safe torque-off on all 55 drives'],['Isolation','Continuous insulation monitoring'],['SoC estimate','Coulomb counting + cell model, ± 3 %'],['Regen','Absorbs braking energy from the joints']],
 mat:'4-layer heavy-copper PCB, conformal coating.',
 ind:['Regenerative braking from the legs flows back here: walking downstairs recovers energy.','<b>Our call:</b> treat the BMS as a safety system, certified separately from the AI.']},
{id:'charging',sys:'power',name:'Wireless charging coils',qty:'2 (feet)',internal:true,cost:280,
 sum:'Coils in both soles let H-01 charge by standing on a floor pad. No plugs, no docking arm.',
 how:'An inductive coil in each sole couples with a pad in the floor. The robot walks onto the pad between tasks and tops up, so it is rarely fully discharged and never needs a person to plug it in.',
 spec:[['Power','2 kW'],['Method','Inductive, through the soles'],['Alignment tolerance','± 30 mm'],['Typical top-up','10 min ≈ 5 % pack']],
 mat:'Litz-wire coils, ferrite backing, polymer sole.',

function makeKnit(){
  const c=document.createElement('canvas');c.width=64;c.height=64;const g=c.getContext('2d');
  for(let y=0;y<64;y+=8){const gr=g.createLinearGradient(0,y,0,y+8);gr.addColorStop(0,'#202020');gr.addColorStop(.5,'#f0f0f0');gr.addColorStop(1,'#202020');g.fillStyle=gr;g.fillRect(0,y,64,8);}
  for(let x=0;x<64;x+=4){g.fillStyle='rgba(0,0,0,.12)';g.fillRect(x,0,1,64);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(10,7);t.anisotropy=8;return t;
}
const knitTex=makeKnit();
function makeMesh(){const c=document.createElement('canvas');c.width=64;c.height=64;const g=c.getContext('2d');g.fillStyle='#d8d8d8';g.fillRect(0,0,64,64);
  g.fillStyle='#1c1c1c';for(let y=0;y<8;y++)for(let x=0;x<8;x++){g.beginPath();g.arc(x*8+4+(y%2)*4,y*8+4,1.9,0,Math.PI*2);g.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(26,26);t.anisotropy=8;return t;}
function makePerf(){const c=document.createElement('canvas');c.width=128;c.height=128;const g=c.getContext('2d');g.fillStyle='#e8e8e8';g.fillRect(0,0,128,128);
  for(let y=0;y<128;y+=2){g.fillStyle=y%4?'rgba(0,0,0,.08)':'rgba(255,255,255,.1)';g.fillRect(0,y,128,1);}
  g.fillStyle='#050505';for(let y=0;y<8;y++)for(let x=0;x<8;x++){g.beginPath();g.arc(x*16+8+(y%2)*8,y*16+8,3.6,0,Math.PI*2);g.fill();}

function resetM(m){m.bumpMap=null;m.sheen=0;m.clearcoat=0;m.clearcoatRoughness=0;m.metalness=0;m.roughness=0.5;m.emissive.set(0);m.emissiveIntensity=1;m.transmission=0;}

function gloss(m,c){m.color.set(c);m.roughness=0.26;m.clearcoat=0.9;m.clearcoatRoughness=0.12;}
function satin(m,c){m.color.set(c);m.roughness=0.55;m.clearcoat=0.25;m.clearcoatRoughness=0.4;}

  resetM(m);const st=F.style;

    case 'skull': F.face==='knit'?knit(m,F.shell):st==='knit'?satin(m,F.shell):gloss(m,F.shell);break;
    case 'soft': st==='hard'?(m.color.set(F.soft),m.roughness=0.55,m.clearcoat=0.3):knit(m,F.soft);break;
    case 'accent': m.color.set(F.accent);m.roughness=st==='knit'?0.8:0.42;m.clearcoat=st==='knit'?0:0.4;break;
    case 'handc': m.color.set(F.hand);m.roughness=st==='knit'?0.6:0.4;m.clearcoat=st==='knit'?0.1:0.4;break;
    case 'footc': m.color.set(F.foot);m.roughness=0.55;m.clearcoat=0.25;break;
    case 'ear': st==='knit'||F.face==='knit'?knit(m,F.ear):satin(m,F.ear);break;
    case 'visor': m.color.set(F.visor);m.roughness=0.04;m.metalness=0.35;m.clearcoat=1;break;
    case 'plate': satin(m,F.visor);break;
    case 'rim': m.color.set(F.rim);m.metalness=0.6;m.roughness=0.3;break;
    case 'lens': m.color.set('#030304');m.roughness=0.08;m.metalness=0.2;m.clearcoat=1;break;
    case 'eyering': m.color.set('#ffffff');m.emissive.set('#ffffff');m.emissiveIntensity=state.power?0.45:0;m.roughness=0.35;break;
    case 'glow': m.color.set(F.glow);m.emissive.set(F.glow);m.emissiveIntensity=1.8;m.roughness=0.4;break;
    case 'livery': m.color.set(0xffffff);m.roughness=0.5;break;
    case 'metal': m.color.set(F.metal);m.metalness=1;m.roughness=0.3;break;
    case 'motor': m.color.set(F.motor);m.metalness=0.75;m.roughness=0.38;break;
    case 'copper': m.color.set('#c9824d');m.metalness=1;m.roughness=0.32;break;
    case 'magnet': m.color.set('#5b6169');m.metalness=0.9;m.roughness=0.25;break;

const HL=new THREE.Color('#9fd3ee');
function applyLook(){
  applyFace();

  for(const o of allMeshes){
    const m=o.material,r=m.userData.role;styleRole(m,r);
    const cover=COVER.has(r)&&r!=='glow';
    const isSel=ss.has(o.userData.comp);
    if(state.xray&&COVER.has(r)){
      m.transparent=true;m.depthWrite=false;
      m.opacity=isSel?0.55:(r==='glow'?0.5:(r==='livery'?0.1:0.07));
    }else if(state.xray&&state.sel&&!isSel){m.transparent=true;m.opacity=0.16;m.depthWrite=false;
    }else{m.transparent=r==='livery';m.opacity=1;m.depthWrite=r!=='livery';}
    o.castShadow=!(state.xray&&cover)&&r!=='livery'&&r!=='glow';
    if(isSel&&r!=='glow'&&r!=='livery'&&r!=='tactile'&&r!=='imu'){m.emissive.copy(HL);m.emissiveIntensity=state.xray?0.08:(r==='shell'||r==='soft'||r==='skull'?0.22:0.3);}
    m.needsUpdate=true;
  }
  for(const o of L.meshes){
    const m=o.material,r=m.userData.role;styleRole(m,r);
    const idx=L.parts.indexOf(o.userData.part),isSel=idx===L.sel;
    if(L.sel>=0&&!isSel){m.transparent=true;m.opacity=0.2;m.depthWrite=false;}
    else if(r==='glass'){m.transparent=true;m.opacity=0.35;m.depthWrite=false;}
    else if(r==='livery'||r==='label'){m.transparent=true;m.opacity=1;m.depthWrite=false;}
    else{m.transparent=false;m.opacity=1;m.depthWrite=true;}
    if(isSel&&r!=='glow'&&r!=='label'&&r!=='livery'){m.emissive.copy(HL);m.emissiveIntensity=0.1;}
    m.needsUpdate=true;
  }
  discMat.color.set(state.bg==='void'?'#1d1f23':'#f4f5f6');
  ringMat.color.set(F.glow);
}
/* glow animation: power, mode, zones */
const OFFC=new THREE.Color(),GC=new THREE.Color(),RC=new THREE.Color();
const ZDELAY={face:0.15,ears:0.35,rim:0.5,seams:0.7,spine:0.9};
function updateGlow(t){
  OFFC.set(F.accent);GC.set(F.glow);RC.set(F.rim);
  const bt=state.power?(t-state.bootT):0;
  const mf=F.mode==='breathe'?0.55+0.45*Math.sin(t*1.7):F.mode==='pulse'?(Math.sin(t*4.5)>0?1:0.3):1;
  for(const o of GLOWS){if(!o.visible)continue;const z=o.userData.zone,m=o.material;
    let k=0;if(state.power&&F.zones[z]){const d=ZDELAY[z]||0;k=THREE.MathUtils.clamp((bt-d)/0.35,0,1);k=k*(bt<d+0.35?1:mf)*F.glowI;}
    const base=z==='rim'?RC:GC;
    if(z==='rim'){m.color.copy(RC);m.emissive.copy(RC);m.emissiveIntensity=k*1.6;}
    else{m.color.copy(OFFC).lerp(base,Math.min(1,k));m.emissive.copy(base);m.emissiveIntensity=k*1.8;}
  }
  const lf=state.power?mf*F.glowI:0;
  for(const o of L.meshes){const m=o.material;if(m.userData.role==='glow'){m.emissive.set(F.glow);m.emissiveIntensity=lf*1.8;m.color.copy(OFFC).lerp(GC,Math.min(1,lf));}}
  ringMat.color.copy(state.power?GC:OFFC);
}

function stack(parts,axis='y',pad=0.01){
